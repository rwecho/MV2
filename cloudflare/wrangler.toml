name = "v2ex-push-service"
main = "src/index.ts"
compatibility_date = "2024-02-04"
node_compat = true

[triggers]
crons = ["*/15 * * * *"] # Every 15 minutes

[[kv_namespaces]]
binding = "V2EX_PUSH_KV"
id = "954cd9fe3c9e42b38b9b526dfb9dbec3"
preview_id = "a1c1c9bf8fc64c44986f03a1a0b6ad66"

[vars]
# --- FCM (existing) ---------------------------------------------------------
# FIREBASE_SERVICE_ACCOUNT_JSON = "set via wrangler secret put FIREBASE_SERVICE_ACCOUNT_JSON"
# ADMIN_SECRET = "set via wrangler secret put ADMIN_SECRET"

# --- HMS Push Kit (HarmonyOS devices, deviceType = "hms"/"ohos") ------------
# HMS_APP_ID is the AppGallery Connect *App ID* (Project settings); it is not a
# secret and is used in the URL path:
#   POST https://push-api.cloud.huawei.com/v1/{HMS_APP_ID}/messages:send
# HMS_APP_ID = "1234567890"

# The AGC service-account key file (JSON) used to sign the OAuth2 JWT
# assertion. It contains a private key — always set it as a secret, never here,
# and never commit it:
# HMS_SERVICE_ACCOUNT_JSON = "set via wrangler secret put HMS_SERVICE_ACCOUNT_JSON"

# --- 荣誉墙（永久买断用户名录）----------------------------------------------
# RevenueCat 的 secret key（服务端密钥，非 App 的 public key），用于核验
# POST /honors/join 的购买权益。永久密钥，务必用 wrangler secret：
# REVENUECAT_SECRET_KEY = "set via wrangler secret put REVENUECAT_SECRET_KEY"

