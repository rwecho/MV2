name: Publish Flutter MV2

# 推送 `v*` tag（如 v1.2.36）即自动构建并发布到 TestFlight / Play internal；
# 也可在 Actions 页手动触发（版本号留空则取 app/pubspec.yaml）。
#
# tag 与 `app/pubspec.yaml` 的 `version:` 必须一致，否则 job 直接失败 —— 避免
# 发布出「包名版本 = tag、App 内显示版本 = pubspec」的错版包。
#
# 复用旧仓库的 secrets（名称一字不改，见 V2ex.Maui2/.github/workflows/publish.yml）：
#   KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD,
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON,
#   CERTIFICATES_P12_BASE64, CERTIFICATES_P12_PASSWORD,
#   APPLE_PROVISIONING_PROFILE_NAME, APPLE_SIGNING_IDENTITY,
#   APPSTORE_ISSUER_ID, APPSTORE_API_KEY_ID, APPSTORE_API_PRIVATE_KEY,
#   IOS_PROVISIONING_PROFILE_BASE64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动发布的版本号（如 1.2.36）；留空则取 app/pubspec.yaml'
        required: false
        type: string
      platforms:
        description: '构建平台：all / ios / android（补跑单个商店用）'
        required: false
        type: string
        default: 'all'

permissions:
  contents: read

# 同一 tag / 分支的发布串行执行，避免两次上传在同一商店版本上打架。
concurrency:
  group: publish-flutter-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.3"
  BUNDLE_ID: tech.zb.v2ex.maui.app
  # RevenueCat 公开 SDK key（public key 本来就随二进制分发，不是机密，可入库；
  # 服务端 secret key 在 cloudflare Worker 的 wrangler secret 里，不入库）。
  MV2_REVENUECAT_APPLE_KEY: appl_vhcSVsNoTuUwJWzgJwLgCLeQccs
  MV2_REVENUECAT_GOOGLE_KEY: goog_vPzlRtaqdnrOkwlWxMTUJlhPflb

jobs:
  version:
    name: Derive and verify version
    runs-on: ubuntu-latest
    outputs:
      display_version: ${{ steps.v.outputs.DISPLAY_VERSION }}
      build_version: ${{ steps.v.outputs.BUILD_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute
        id: v
        env:
          # 经 env 传入而不是内联 ${{ }}，避免手动触发时把输入当代码执行。
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | head -1)"
          if [ -z "$PUBSPEC_VERSION" ]; then
            echo "::error::app/pubspec.yaml 里读不到 version:"
            exit 1
          fi
          PUBSPEC_NAME="${PUBSPEC_VERSION%%+*}"
          echo "pubspec version: $PUBSPEC_VERSION"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$PUBSPEC_NAME" ]; then
              echo "::error::tag v$VERSION 与 app/pubspec.yaml 的 $PUBSPEC_NAME 不一致：先把 pubspec 的 version 改成 $VERSION 并提交，再重新打 tag。"
              exit 1
            fi
          else
            VERSION="${INPUT_VERSION:-}"
            [ -n "$VERSION" ] || VERSION="$PUBSPEC_NAME"
          fi

          # 与旧 MAUI CI 完全同一规则：1.2.34 → "1002034" + run number
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          for PART in "$MAJOR" "$MINOR" "$PATCH"; do
            case "$PART" in
              ''|*[!0-9]*)
                echo "::error::版本号必须是 x.y.z 形式（当前 '$VERSION'）"
                exit 1
                ;;
            esac
            if [ "$PART" -gt 999 ]; then
              echo "::error::版本段 $PART 超过 999，会破坏 %03d 拼版规则；请调整发布规则后再发。"
              exit 1
            fi
          done

          BASE_BUILD=$(printf "%d%03d%03d" "$MAJOR" "$MINOR" "$PATCH")
          echo "DISPLAY_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=${BASE_BUILD}${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "releasing $VERSION (base build $BASE_BUILD)"

  build-android:
    if: inputs.platforms == '' || inputs.platforms == 'all' || contains(inputs.platforms, 'android')
    name: Android → Play (internal)
    runs-on: ubuntu-latest
    needs: version
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=v2ex_key
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build app bundle (AAB)
        run: |
          flutter build appbundle \
            --build-name="${{ needs.version.outputs.display_version }}" \
            --build-number="${{ needs.version.outputs.build_version }}" \
            --dart-define=MV2_REVENUECAT_APPLE_KEY="$MV2_REVENUECAT_APPLE_KEY" \
            --dart-define=MV2_REVENUECAT_GOOGLE_KEY="$MV2_REVENUECAT_GOOGLE_KEY"

      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: app/build/app/outputs/bundle/release/app-release.aab

      # Play 的 API 行为是状态依赖的：versionCode 高于现网时必须自动送审
      # （不允许带 changesNotSentForReview），需要人工送审的变更则相反。
      # 所以先按默认（自动送审）上传，失败再带 flag 重试落成草稿。
      - name: Upload to Google Play (internal track)
        id: play_upload
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.BUNDLE_ID }}
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          releaseName: ${{ needs.version.outputs.DISPLAY_VERSION }}
          whatsNewDirectory: distribution/google-play

      - name: Upload to Google Play (needs manual review)
        if: failure() && steps.play_upload.conclusion == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.BUNDLE_ID }}
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal
          releaseName: ${{ needs.version.outputs.DISPLAY_VERSION }}
          whatsNewDirectory: distribution/google-play
          changesNotSentForReview: true

  build-ios:
    if: inputs.platforms == '' || inputs.platforms == 'all' || contains(inputs.platforms, 'ios')
    name: iOS → TestFlight
    # Runner 现状(actions/runner-images#14404、#14850、PR #14877):
    #   27.0 GA = 27A266a(已预装, 镜像默认) / 27.1 = 27A9269(预装的是 Beta) /
    #   27.1 RC = 27A9275(PR #14877 已合并且计划在下一次镜像 rollout 时带上)。
    # 不再用 secret + 自托管 .xip 安装 RC（那是空 secret 就整体挂掉的外部依赖）。
    # 改为按 build 号在镜像里选：有 27A9275 就用它，否则用 27.0 GA(27A266a)，
    # 只找到 Beta 就直接失败——绝不悄悄用 Beta 出正式包。等镜像带上 RC 后，
    # 这里会自动切过去，不需要改代码。
    runs-on: xcode-27
    needs: version
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode (prefer 27.1 RC, else 27.0 GA, never Beta)
        run: |
          set -euo pipefail
          PREFERRED=27A9275   # Xcode 27.1 RC
          FALLBACK=27A266a    # Xcode 27.0 GA

          # 每个 Xcode 的 build 号读 Contents/version.plist，不依赖 xcode-select，
          # 也不用被选中的那个 Xcode 去跑命令（免得受 license 状态影响）。
          list_xcodes() {
            local app build short
            for app in /Applications/Xcode*.app; do
              [ -e "$app/Contents/version.plist" ] || continue
              short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                "$app/Contents/version.plist" 2>/dev/null || true)"
              build="$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' \
                "$app/Contents/version.plist" 2>/dev/null || true)"
              printf '%s\t%s\t%s\n' "$app" "$short" "$build"
            done
          }

          echo "installed Xcodes:"
          list_xcodes | while IFS="$(printf '\t')" read -r app short build; do
            printf '  %-52s %-8s %s\n' "$app" "${short:-?}" "${build:-?}"
          done

          RC_APP=""; GA_APP=""
          while IFS="$(printf '\t')" read -r app short build; do
            case "$build" in
              "$PREFERRED") [ -n "$RC_APP" ] || RC_APP="$app" ;;
              "$FALLBACK")  [ -n "$GA_APP" ] || GA_APP="$app" ;;
            esac
          done < <(list_xcodes)

          if [ -n "$RC_APP" ]; then
            CHOSEN="$RC_APP"; WANT_BUILD="$PREFERRED"; LABEL="Xcode 27.1 RC"
          elif [ -n "$GA_APP" ]; then
            CHOSEN="$GA_APP"; WANT_BUILD="$FALLBACK"; LABEL="Xcode 27.0 GA"
            echo "::notice::镜像还没带 27.1 RC($PREFERRED)，本次用 27.0 GA($FALLBACK) 出包"
          else
            echo "::error::镜像里既没有 27.1 RC($PREFERRED) 也没有 27.0 GA($FALLBACK)——拒绝用 Beta 出正式包"
            exit 1
          fi

          sudo xcode-select -s "$CHOSEN/Contents/Developer"
          sudo xcodebuild -license accept >/dev/null 2>&1 || true

          # 断言选中的这个 app 确实报出期望的 build，别把 Beta/别的版本混出去。
          ACTUAL="$(DEVELOPER_DIR="$CHOSEN/Contents/Developer" xcodebuild -version \
            | awk '/Build version/ {print $3}')"
          if [ "$ACTUAL" != "$WANT_BUILD" ]; then
            echo "::error::$CHOSEN 报的 build 是 $ACTUAL，期望 $WANT_BUILD"
            exit 1
          fi

          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "selected: $LABEL ($ACTUAL) at $CHOSEN"
          xcodebuild -version
          echo "iPhoneOS SDK: $SDK"
          {
            echo "### iOS toolchain"
            echo ""
            echo "| Xcode | Build | Path | iPhoneOS SDK |"
            echo "| --- | --- | --- | --- |"
            echo "| $LABEL | $ACTUAL | \`$CHOSEN\` | $SDK |"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

      # Profiles are committed in the repo (they contain no secrets — just
      # team + bundle id + entitlements). Install them to the standard
      # location so `xcodebuild archive` can find them without an account
      # session.
      - name: Install provisioning profiles
        run: |
          PP="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP"
          cp ios/profiles/tech_zb_v2ex_maui_app.mobileprovision "$PP/66aa10d5-cd15-4941-b2ee-c3b174492454.mobileprovision"
          cp ios/profiles/mv2_widget_app_store.mobileprovision "$PP/7cf1e83f-70aa-4fea-b50a-fdc365fb21c7.mobileprovision"

      - name: Build IPA
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          flutter build ipa --release \
            --build-name="${{ needs.version.outputs.display_version }}" \
            --build-number="${{ needs.version.outputs.build_version }}" \
            --dart-define=MV2_REVENUECAT_APPLE_KEY="$MV2_REVENUECAT_APPLE_KEY" \
            --dart-define=MV2_REVENUECAT_GOOGLE_KEY="$MV2_REVENUECAT_GOOGLE_KEY" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Locate IPA
        id: ipa
        run: |
          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found in build/ios/ipa"
            ls -la build/ios/ipa || true
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          echo "path=${{ github.workspace }}/app/$IPA_PATH" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------ dSYM
      # Xcode 把 dSYM 生成为 Runner.xcarchive/dSYMs，但 archive 会随 runner 一起
      # 销毁。原本符号上传只依赖工程里的 "Upload Crashlytics Symbols" Run Script：
      # uploader 找不到时它 warning + exit 0，而 Flutter 成功路径会吞掉 xcodebuild
      # 输出——失败完全不可见（2.2.12 的符号就是这么没有保证的）。
      # 下面三步把它变成 CI 里显式、同步、会失败的契约：先核对 dSYM 与真正打进
      # IPA 的二进制 UUID 一致，再留一份 artifact 兜底，最后同步上传 Crashlytics
      # 并逐个 UUID 在日志里确认（客户端已提交；服务端是否入库仍只能在
      # Crashlytics 控制台侧确认）。
      # 任何一步失败都会挡住后面的 TestFlight 上传，避免再发布一个没有符号的包。
      - name: Verify dSYMs match the built binaries
        run: |
          set -euo pipefail
          ARCHIVE=build/ios/archive/Runner.xcarchive
          APP="$ARCHIVE/Products/Applications/Runner.app"
          test -d "$ARCHIVE/dSYMs" || {
            echo "::error::$ARCHIVE/dSYMs 不存在——archive 没有带符号"
            exit 1
          }

          check() {
            local bin="$1" dsym="$2" buuid duuid
            test -e "$bin" || { echo "::error::缺少二进制 $bin"; exit 1; }
            test -d "$dsym" || { echo "::error::缺少 $dsym"; exit 1; }
            buuid="$(dwarfdump --uuid "$bin" | awk '{print $2}' | sort -u | tr '\n' ' ')"
            duuid="$(dwarfdump --uuid "$dsym" | awk '{print $2}' | sort -u | tr '\n' ' ')"
            test -n "$duuid" || { echo "::error::$dsym 里读不到 UUID"; exit 1; }
            test "$buuid" = "$duuid" || {
              echo "::error::UUID 对不上：$dsym ($duuid) vs $bin ($buuid)"
              exit 1
            }
            echo "OK  $dsym  ->  $duuid"
          }

          check "$APP/Runner" "$ARCHIVE/dSYMs/Runner.app.dSYM"
          check "$APP/PlugIns/MV2Widget.appex/MV2Widget" "$ARCHIVE/dSYMs/MV2Widget.appex.dSYM"

          # Dart 栈要靠 App.framework 的 dSYM 才能符号化：archive 里有就核对，没有只
          # 告警——上传步骤还会去构建产物里找一次，两边都没有才会失败。
          if [ -e "$APP/Frameworks/App.framework/App" ] &&
             [ -d "$ARCHIVE/dSYMs/App.framework.dSYM" ]; then
            check "$APP/Frameworks/App.framework/App" "$ARCHIVE/dSYMs/App.framework.dSYM"
          else
            echo "::warning::archive 里没有 App.framework.dSYM——见 Upload dSYMs to Crashlytics 的进一步核对"
          fi
          ls -la "$ARCHIVE/dSYMs"

      - name: Save dSYMs as artifact
        uses: actions/upload-artifact@v4
        with:
          # path 相对仓库根目录（不受 defaults.run.working-directory 影响，
          # 与上面的 android-bundle 一致）。除了 archive 里的 dSYM，还要带上构建
          # 产物里的 *.framework.dSYM——Flutter 的 App.framework 可能不在 archive
          # 里，而它正是 Dart 栈符号化的关键，兜底副本不能漏。
          name: ios-dsyms-${{ needs.version.outputs.display_version }}-${{ needs.version.outputs.build_version }}
          path: |
            app/build/ios/archive/Runner.xcarchive/dSYMs
            app/build/ios/Release-iphoneos/*.framework.dSYM
            app/build/ios/iphoneos/*.framework.dSYM
            app/build/ios/Build/Products/Release-iphoneos/*.framework.dSYM
          if-no-files-found: error
          retention-days: 90

      - name: Upload dSYMs to Crashlytics
        run: |
          set -euo pipefail
          ARCHIVE=build/ios/archive/Runner.xcarchive
          APP="$ARCHIVE/Products/Applications/Runner.app"
          LOG=/tmp/upload-symbols.log

          # firebase-ios-sdk 经 SPM 引入（CI 日志里的 "Xcode is fetching Swift
          # Package Manager dependencies"），upload-symbols 落在 SourcePackages
          # 的 checkout 里；若日后迁回 CocoaPods，则相对 app/ 是 ios/Pods/…
          UPLOAD_SYMBOLS=""
          for candidate in \
            build/ios/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols \
            "$HOME"/Library/Developer/Xcode/DerivedData/Runner-*/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols \
            ios/Pods/FirebaseCrashlytics/upload-symbols; do
            if [ -x "$candidate" ]; then
              UPLOAD_SYMBOLS="$candidate"
              break
            fi
          done
          if [ -z "$UPLOAD_SYMBOLS" ]; then
            echo "::error::找不到 Crashlytics 的 upload-symbols——dSYM 没有进 Firebase，先修 CI 再发布"
            find build/ios ios/Pods "$HOME/Library/Developer/Xcode/DerivedData" \
              -maxdepth 7 -name upload-symbols 2>/dev/null | head || true
            exit 1
          fi
          echo "using: $UPLOAD_SYMBOLS"

          # 上传日志只能证明"客户端提交成功"，证明不了"进了我们这个 Firebase app"：
          # 换成别的 GoogleService-Info.plist，工具照样逐 UUID 报成功。所以把目标
          # app 钉在这里，plist 被换错/轮换时直接失败，而不是绿着发布没符号的包。
          PLIST=ios/Runner/GoogleService-Info.plist
          EXPECTED_APP_ID=1:861040628994:ios:582e7a57717fc30d5f9e1b
          ACTUAL_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :GOOGLE_APP_ID' "$PLIST" 2>/dev/null || true)"
          if [ "$ACTUAL_APP_ID" != "$EXPECTED_APP_ID" ]; then
            echo "::error::$PLIST 的 GOOGLE_APP_ID='$ACTUAL_APP_ID'，期望 '$EXPECTED_APP_ID'——符号会进错项目"
            exit 1
          fi
          echo "target Firebase app: $ACTUAL_APP_ID"

          # 上传 archive 的 dSYMs（app + 扩展 + 框架），再补上构建产物里可能没被
          # 归档的 *.framework.dSYM——Flutter 的 App.framework 就属于这一类。
          shopt -s nullglob
          DSYM_PATHS=("$ARCHIVE/dSYMs")
          for dir in build/ios/Release-iphoneos build/ios/iphoneos \
            build/ios/Build/Products/Release-iphoneos \
            "$HOME"/Library/Developer/Xcode/DerivedData/Runner-*/Build/Products/Release-iphoneos; do
            for candidate in "$dir"/*.framework.dSYM "$dir"/*.app.dSYM "$dir"/*.appex.dSYM; do
              DSYM_PATHS+=("$candidate")
            done
          done
          printf 'upload paths:\n'
          printf '  %s\n' "${DSYM_PATHS[@]}"

          # Dart 栈只有靠 App.framework 的 dSYM 才能符号化。archive 和构建产物里
          # 都找不到就直接失败——"CI 绿了但 Dart 崩溃看不懂"正是要防的那类问题。
          if [ -e "$APP/Frameworks/App.framework/App" ]; then
            dart_dsym=0
            for path in "${DSYM_PATHS[@]}"; do
              case "$path" in
                */App.framework.dSYM) dart_dsym=1 ;;
                *) for candidate in "$path"/App.framework.dSYM; do
                     [ -d "$candidate" ] && dart_dsym=1
                   done ;;
              esac
            done
            if [ "$dart_dsym" -eq 0 ]; then
              echo "::error::archive 和构建产物里都没有 App.framework.dSYM——Dart 栈无法符号化"
              exit 1
            fi
          fi

          # CLI 同步上传，这里有两个实测过的坑：
          #   1. paths 前必须有 `--`。否则路径会被当成未知参数吞掉，报
          #      "error: No dSYM paths provided" 却什么也不传；
          #   2. 它**即使 dSYM 缺失/损坏也返回 0**（只打 warning），所以退出码
          #      不足以证明符号进了 Crashlytics，下面还要逐个 UUID 核对日志。
          # 独立 TMPDIR：工程里的 Run Script 阶段是后台上传，两者都会写
          # $TMPDIR/arm64-<uuid>.csym，共用 TMPDIR 有互相删文件的风险。
          SPEW_TMP="$(mktemp -d)"
          set +e
          TMPDIR="$SPEW_TMP" "$UPLOAD_SYMBOLS" \
            -gsp ios/Runner/GoogleService-Info.plist \
            -p ios -- "${DSYM_PATHS[@]}" 2>&1 | tee "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          rm -rf "$SPEW_TMP"
          if [ "$rc" -ne 0 ]; then
            echo "::error::upload-symbols 失败（exit $rc）"
            tail -30 "$LOG"
            exit 1
          fi

          # 某个 dSYM 只有在日志里留下带它 UUID 的结果行，才算真的提交了：
          # "Successfully submitted symbols ... UUID <32位小写、不带横线>"，
          # 另外 "Already uploaded this dSYM" / "Skipping upload of cSYM" 也说明
          # 服务端已有这份符号（工程里的 Run Script 可能已经先传过一遍）。
          # 用单个 awk 而不是 `grep | grep -q`：后者在 pipefail 下会因为下游
          # 提前退出、上游吃 SIGPIPE(141) 而把成功的 UUID 判成失败。
          verify_uploaded() {
            local dsym="$1" uuids uuid norm
            uuids="$( { dwarfdump --uuid "$dsym" 2>/dev/null || true; } | awk '{print $2}')"
            if [ -z "$uuids" ]; then
              echo "::error::$dsym 读不到 UUID（dSYM 不完整）"
              missing=1
              return
            fi
            while read -r uuid; do
              [ -n "$uuid" ] || continue
              norm=$(printf '%s' "$uuid" | tr 'A-Z' 'a-z' | tr -d '-')
              if ! awk -v u="$norm" '
                { l = tolower($0) }
                index(l, u) && (index(l, "successfully") || index(l, "already uploaded") || index(l, "skipping upload")) { ok = 1 }
                END { exit(ok ? 0 : 1) }
              ' "$LOG"; then
                echo "::error::$dsym 的 UUID $uuid 没有出现在上传日志里"
                missing=1
              fi
            done <<< "$uuids"
          }

          missing=0
          checked=0
          for path in "${DSYM_PATHS[@]}"; do
            case "$path" in
              *.dSYM) checked=$((checked + 1)); verify_uploaded "$path" ;;
              *) for dsym in "$path"/*.dSYM; do
                   [ -d "$dsym" ] || continue
                   checked=$((checked + 1))
                   verify_uploaded "$dsym"
                 done ;;
            esac
          done
          if [ "$missing" -ne 0 ]; then
            echo "----- $LOG (tail) -----"
            tail -30 "$LOG"
            exit 1
          fi
          if [ "$checked" -eq 0 ]; then
            echo "::error::没有任何 dSYM 被上传——符号没有进 Crashlytics"
            exit 1
          fi
          echo "dSYMs uploaded to Crashlytics: ${{ needs.version.outputs.display_version }} ($checked dSYMs verified in log)"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
