name: Publish Flutter MV2

# 推送 `v*` tag（如 v1.2.36）即自动构建并发布到 TestFlight / Play internal；
# 也可在 Actions 页手动触发（版本号留空则取 app/pubspec.yaml）。
#
# tag 与 `app/pubspec.yaml` 的 `version:` 必须一致，否则 job 直接失败 —— 避免
# 发布出「包名版本 = tag、App 内显示版本 = pubspec」的错版包。
#
# 复用旧仓库的 secrets（名称一字不改，见 V2ex.Maui2/.github/workflows/publish.yml）：
#   KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD,
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON,
#   CERTIFICATES_P12_BASE64, CERTIFICATES_P12_PASSWORD,
#   APPLE_PROVISIONING_PROFILE_NAME, APPLE_SIGNING_IDENTITY,
#   APPSTORE_ISSUER_ID, APPSTORE_API_KEY_ID, APPSTORE_API_PRIVATE_KEY,
#   IOS_PROVISIONING_PROFILE_BASE64

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动发布的版本号（如 1.2.36）；留空则取 app/pubspec.yaml'
        required: false
        type: string

permissions:
  contents: read

# 同一 tag / 分支的发布串行执行，避免两次上传在同一商店版本上打架。
concurrency:
  group: publish-flutter-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.3"
  BUNDLE_ID: tech.zb.v2ex.maui.app

jobs:
  version:
    name: Derive and verify version
    runs-on: ubuntu-latest
    outputs:
      display_version: ${{ steps.v.outputs.DISPLAY_VERSION }}
      build_version: ${{ steps.v.outputs.BUILD_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute
        id: v
        env:
          # 经 env 传入而不是内联 ${{ }}，避免手动触发时把输入当代码执行。
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | head -1)"
          if [ -z "$PUBSPEC_VERSION" ]; then
            echo "::error::app/pubspec.yaml 里读不到 version:"
            exit 1
          fi
          PUBSPEC_NAME="${PUBSPEC_VERSION%%+*}"
          echo "pubspec version: $PUBSPEC_VERSION"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            if [ "$VERSION" != "$PUBSPEC_NAME" ]; then
              echo "::error::tag v$VERSION 与 app/pubspec.yaml 的 $PUBSPEC_NAME 不一致：先把 pubspec 的 version 改成 $VERSION 并提交，再重新打 tag。"
              exit 1
            fi
          else
            VERSION="${INPUT_VERSION:-}"
            [ -n "$VERSION" ] || VERSION="$PUBSPEC_NAME"
          fi

          # 与旧 MAUI CI 完全同一规则：1.2.34 → "1002034" + run number
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          for PART in "$MAJOR" "$MINOR" "$PATCH"; do
            case "$PART" in
              ''|*[!0-9]*)
                echo "::error::版本号必须是 x.y.z 形式（当前 '$VERSION'）"
                exit 1
                ;;
            esac
            if [ "$PART" -gt 999 ]; then
              echo "::error::版本段 $PART 超过 999，会破坏 %03d 拼版规则；请调整发布规则后再发。"
              exit 1
            fi
          done

          BASE_BUILD=$(printf "%d%03d%03d" "$MAJOR" "$MINOR" "$PATCH")
          echo "DISPLAY_VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=${BASE_BUILD}${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "releasing $VERSION (base build $BASE_BUILD)"

  build-android:
    name: Android → Play (internal)
    runs-on: ubuntu-latest
    needs: version
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Restore the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=v2ex_key
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build app bundle (AAB)
        run: |
          flutter build appbundle \
            --build-name="${{ needs.version.outputs.display_version }}" \
            --build-number="${{ needs.version.outputs.build_version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: app/build/app/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.BUNDLE_ID }}
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: internal

  build-ios:
    name: iOS → TestFlight
    runs-on: macos-latest
    needs: version
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v1
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12_BASE64 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

      # Profiles are committed in the repo (they contain no secrets — just
      # team + bundle id + entitlements). Install them to the standard
      # location so `xcodebuild archive` can find them without an account
      # session.
      - name: Install provisioning profiles
        run: |
          PP="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP"
          cp ios/profiles/tech_zb_v2ex_maui_app.mobileprovision "$PP/66aa10d5-cd15-4941-b2ee-c3b174492454.mobileprovision"
          cp ios/profiles/mv2_widget_app_store.mobileprovision "$PP/7cf1e83f-70aa-4fea-b50a-fdc365fb21c7.mobileprovision"

      - name: Build IPA
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          flutter build ipa --release \
            --build-name="${{ needs.version.outputs.display_version }}" \
            --build-number="${{ needs.version.outputs.build_version }}" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Locate IPA
        id: ipa
        run: |
          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found in build/ios/ipa"
            ls -la build/ios/ipa || true
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          echo "path=${{ github.workspace }}/app/$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
