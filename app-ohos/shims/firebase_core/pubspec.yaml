name: firebase_core
description: >-
  HarmonyOS (ohos) shim for firebase_core. NOT Firebase: Firebase has no
  HarmonyOS SDK. `Firebase.initializeApp()` always throws so MV2's existing
  `Mv2PushGateway.initialize()` catch path leaves push permanently unavailable.
  See app-ohos/README.md.
version: 4.14.0
publish_to: 'none'

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
