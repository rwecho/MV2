<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  D · 放弃 V 字形：人站在正中，两粒药丸分列左右。
  "两个选择"最容易读懂，但失去了 V / V2EX 的字形联想。
-->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1"
     xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="0" width="456" height="456" fill="#ffffff" />

    <!-- 红药丸（左） -->
    <line x1="88" y1="292" x2="164" y2="242"
          stroke="#E5484D" stroke-width="40" stroke-linecap="round" />
    <!-- 蓝药丸（右） -->
    <line x1="380" y1="292" x2="304" y2="242"
          stroke="#2563EB" stroke-width="40" stroke-linecap="round" />

    <!-- 胶囊接缝 -->
    <line x1="117.2" y1="253.6" x2="134.8" y2="280.4"
          stroke="#ffffff" stroke-width="5" />
    <line x1="350.8" y1="253.6" x2="333.2" y2="280.4"
          stroke="#ffffff" stroke-width="5" />

    <!-- 人 -->
    <circle cx="228" cy="250" r="27" fill="#111827" />
    <path d="M 184 412 Q 184 306 228 306 Q 272 306 272 412 Z" fill="#111827" />
</svg>
