          stroke="#2563EB" stroke-width="46" stroke-linecap="round" />
    <line x1="176" y1="236" x2="112" y2="144"
          stroke="#E5484D" stroke-width="46" stroke-linecap="round" />

    <circle cx="228" cy="306" r="28" fill="#111827" />
