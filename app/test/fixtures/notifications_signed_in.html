  shape (docs/12 §2.2): items are `div[id^="n_"]` under `#Wrapper`, each with a

  sections are synthetic/illustrative — the real unread marker is unverifiable
  without a signed-in session.

  `input.sll` mirrors the real page's notification Atom feed input (the legacy
  MAUI client read it as `NotificationInfo.Feed`); its `once` token is fake.
-->
